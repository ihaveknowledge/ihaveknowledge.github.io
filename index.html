<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro 8-Bit Duck Shoot Arcade</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d0e15;
      background-image: radial-gradient(#1f2233 15%, transparent 16%), radial-gradient(#181a27 15%, transparent 16%);
      background-size: 30px 30px;
      background-position: 0 0, 15px 15px;
      color: #fff;
      font-family: 'Press Start 2P', monospace, monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 12px;
    }

    .arcade-wrapper {
      position: relative;
      padding: 16px;
      background: #2b1f1d;
      border: 6px solid #4a3429;
      border-radius: 18px;
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.9), inset 0 0 15px rgba(0, 0, 0, 0.7);
    }

    .marquee-header {
      background: #e64522;
      border: 4px solid #fff;
      color: #ffeb3b;
      text-shadow: 3px 3px 0 #b71c1c, 5px 5px 0 #000;
      text-align: center;
      padding: 8px 12px;
      margin-bottom: 12px;
      border-radius: 6px;
      font-size: 18px;
      letter-spacing: 2px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .screen-bezel {
      position: relative;
      background: #111;
      padding: 12px;
      border-radius: 12px;
      box-shadow: inset 0 0 25px rgba(0,0,0,0.9);
      border: 4px solid #1c1d24;
    }

    canvas {
      display: block;
      background: #3cbcfc;
      border: 4px solid #000;
      border-radius: 6px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      cursor: crosshair;
    }

    /* CRT scanline simulation */
    .scanlines {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      bottom: 12px;
      pointer-events: none;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.35) 50%
      );
      background-size: 100% 4px;
      border-radius: 6px;
      z-index: 10;
    }

    .crt-glow {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      bottom: 12px;
      pointer-events: none;
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.6);
      border-radius: 6px;
      z-index: 11;
    }

    .controls-bar {
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #9e9e9e;
      font-size: 10px;
      padding: 0 6px;
    }

    .btn-toggle {
      background: #37474f;
      color: #eceff1;
      font-family: inherit;
      font-size: 9px;
      border: 2px solid #78909c;
      border-radius: 4px;
      padding: 6px 10px;
      cursor: pointer;
      box-shadow: 0 3px 0 #263238;
      transition: all 0.1s;
    }

    .btn-toggle:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #263238;
    }
  </style>
</head>
<body>

  <div class="arcade-wrapper">
    <div class="marquee-header">★ 8-BIT DUCK HUNT ★</div>
    
    <div class="screen-bezel">
      <canvas id="gameCanvas" width="768" height="480"></canvas>
      <div id="scanlineOverlay" class="scanlines"></div>
      <div class="crt-glow"></div>
    </div>

    <div class="controls-bar">
      <span>AIM & SHOOT: LEFT CLICK</span>
      <button id="toggleAudioBtn" class="btn-toggle">AUDIO: ON</button>
      <button id="toggleScanBtn" class="btn-toggle">CRT SCANLINES: ON</button>
      <span>20 SHELLS / ROUND</span>
    </div>
  </div>

  <script>
    // --- AUDIO SYNTHESIS (Web Audio API) ---
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playGunshot() {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;

        // White noise burst for blast
        const bufferSize = this.ctx.sampleRate * 0.18;
        const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = Math.random() * 2 - 1;
        }

        const whiteNoise = this.ctx.createBufferSource();
        whiteNoise.buffer = noiseBuffer;

        const noiseFilter = this.ctx.createBiquadFilter();
        noiseFilter.type = 'lowpass';
        noiseFilter.frequency.setValueAtTime(1400, now);
        noiseFilter.frequency.exponentialRampToValueAtTime(100, now + 0.18);

        const noiseGain = this.ctx.createGain();
        noiseGain.gain.setValueAtTime(0.7, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);

        whiteNoise.connect(noiseFilter);
        noiseFilter.connect(noiseGain);
        noiseGain.connect(this.ctx.destination);
        whiteNoise.start(now);

        // Low thump oscillator
        const osc = this.ctx.createOscillator();
        const oscGain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.16);

        oscGain.gain.setValueAtTime(0.8, now);
        oscGain.gain.exponentialRampToValueAtTime(0.01, now + 0.16);

        osc.connect(oscGain);
        oscGain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.18);
      }

      playHit(isDuck) {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';

        if (isDuck) {
          // Double chirp for Duck
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.setValueAtTime(620, now + 0.05);
          osc.frequency.setValueAtTime(880, now + 0.1);
        } else {
          // Honk drop for Goose
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.setValueAtTime(280, now + 0.06);
          osc.frequency.setValueAtTime(340, now + 0.12);
        }

        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.22);
      }

      playMiss() {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(130, now);
        osc.frequency.linearRampToValueAtTime(65, now + 0.12);

        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.12);
      }

      playGameOver() {
        if (!this.enabled || !this.ctx) return;
        const notes = [440, 392, 349, 311];
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const t = this.ctx.currentTime + idx * 0.14;
          osc.type = 'square';
          osc.frequency.setValueAtTime(freq, t);

          gain.gain.setValueAtTime(0.25, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.14);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.15);
        });
      }
    }

    const sound = new SoundEngine();

    // --- CANVAS & GAME STATE ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scanlines = document.getElementById('scanlineOverlay');
    const toggleAudioBtn = document.getElementById('toggleAudioBtn');
    const toggleScanBtn = document.getElementById('toggleScanBtn');

    const WIDTH = canvas.width;
    const HEIGHT = canvas.height;
    const GROUND_Y = HEIGHT - 90;

    const STATE_TITLE = 0;
    const STATE_PLAYING = 1;
    const STATE_GAMEOVER = 2;

    let gameState = STATE_TITLE;
    let score = 0;
    let shotsLeft = 20;
    const MAX_SHOTS = 20;
    let streak = 0;
    let ducksHit = 0;
    let geeseHit = 0;
    let totalShotsFired = 0;
    let highScore = parseInt(localStorage.getItem('duckhunt_highscore') || '0', 10);

    let birds = [];
    let popups = [];
    let clouds = [];
    let grassBlades = [];
    let screenFlash = 0;
    let cameraShake = 0;
    let lastSpawnTime = 0;

    // --- BACKGROUND DECORATION GENERATORS ---
    function initClouds() {
      clouds = [
        { x: 50, y: 40, width: 90, speed: 0.25 },
        { x: 320, y: 70, width: 120, speed: 0.18 },
        { x: 610, y: 30, width: 80, speed: 0.3 }
      ];
    }

    function initGrass() {
      grassBlades = [];
      for (let x = 0; x < WIDTH; x += 18) {
        grassBlades.push({
          x: x,
          height: 14 + Math.floor(Math.random() * 14),
          color: Math.random() > 0.4 ? '#44a821' : '#2e7d32'
        });
      }
    }

    // --- BIRD ENTITY ---
    class Bird {
      constructor() {
        this.isDuck = Math.random() < 0.55;
        this.type = this.isDuck ? 'DUCK' : 'GOOSE';
        this.points = this.isDuck ? 10 : 5;

        this.fromLeft = Math.random() < 0.5;
        this.x = this.fromLeft ? -50 : WIDTH + 50;
        this.y = 80 + Math.random() * (GROUND_Y - 180);

        // Movement speeds and flight paths
        const baseSpeed = this.isDuck ? 2.8 + Math.random() * 1.6 : 3.6 + Math.random() * 1.8;
        this.vx = (this.fromLeft ? 1 : -1) * baseSpeed;
        this.vy = (Math.random() - 0.5) * 1.5;

        this.flightTimer = Math.random() * 50;
        this.zigzagPhase = Math.random() * Math.PI * 2;

        this.state = 'FLYING'; // 'FLYING' | 'STRUCK' | 'FALLING'
        this.stateTimer = 0;
        this.frame = 0;
        this.animSpeed = 0.18;

        this.width = 44;
        this.height = 36;
      }

      update() {
        if (this.state === 'FLYING') {
          this.x += this.vx;
          this.flightTimer += 0.05;
          this.y += Math.sin(this.flightTimer + this.zigzagPhase) * 1.6 + this.vy;

          // Keep in bounds vertically
          if (this.y < 40) { this.y = 40; this.vy = Math.abs(this.vy); }
          if (this.y > GROUND_Y - 50) { this.y = GROUND_Y - 50; this.vy = -Math.abs(this.vy); }

          this.frame += this.animSpeed;
        } else if (this.state === 'STRUCK') {
          this.stateTimer--;
          if (this.stateTimer <= 0) {
            this.state = 'FALLING';
          }
        } else if (this.state === 'FALLING') {
          this.y += 6.5;
          this.x += this.vx * 0.2;
          this.frame += 0.3;
        }
      }

      draw() {
        ctx.save();
        ctx.translate(Math.round(this.x), Math.round(this.y));

        const facingRight = this.vx > 0;
        if (!facingRight) {
          ctx.scale(-1, 1);
        }

        const flapFrame = Math.floor(this.frame) % 3;

        if (this.state === 'STRUCK') {
          // Pixel blast flash state
          drawPixelHitEffect(this.isDuck);
        } else if (this.state === 'FALLING') {
          ctx.rotate(facingRight ? Math.PI / 2 : -Math.PI / 2);
          if (this.isDuck) {
            drawDuckPixel(0, true);
          } else {
            drawGoosePixel(0, true);
          }
        } else {
          // Normal Flying
          if (this.isDuck) {
            drawDuckPixel(flapFrame, false);
          } else {
            drawGoosePixel(flapFrame, false);
          }
        }

        ctx.restore();
      }
    }

    // --- PIXEL SPRITE RENDERERS ---
    // High-contrast 8-bit procedural sprites drawn with solid unit blocks
    function drawDuckPixel(frame, isDead) {
      const p = 3; // Pixel scale factor

      // Head (Emerald green NES duck)
      ctx.fillStyle = '#008800';
      ctx.fillRect(4 * p, -4 * p, 4 * p, 4 * p);
      ctx.fillStyle = '#00bb00';
      ctx.fillRect(5 * p, -3 * p, 2 * p, 2 * p);

      // White collar ring
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(4 * p, 0 * p, 3 * p, 1 * p);

      // Beak (Orange)
      ctx.fillStyle = '#ff8800';
      ctx.fillRect(8 * p, -2 * p, 3 * p, 2 * p);

      // Eye
      ctx.fillStyle = '#000000';
      ctx.fillRect(6 * p, -3 * p, 1 * p, 1 * p);

      // Body (Rich Brown)
      ctx.fillStyle = '#6b3e11';
      ctx.fillRect(-2 * p, 0 * p, 7 * p, 5 * p);
      ctx.fillStyle = '#8b5118';
      ctx.fillRect(-1 * p, 1 * p, 5 * p, 3 * p);

      // Tail
      ctx.fillStyle = '#422405';
      ctx.fillRect(-4 * p, 1 * p, 2 * p, 2 * p);

      // Wing (Blue/White speculum on animated brown flap)
      ctx.fillStyle = '#1e3c72';
      if (frame === 0) {
        // Wings level
        ctx.fillRect(-1 * p, 1 * p, 4 * p, 2 * p);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0 * p, 2 * p, 2 * p, 1 * p);
      } else if (frame === 1) {
        // Wings up
        ctx.fillRect(-1 * p, -4 * p, 3 * p, 5 * p);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0 * p, -2 * p, 2 * p, 2 * p);
      } else {
        // Wings down
        ctx.fillRect(-1 * p, 4 * p, 3 * p, 4 * p);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0 * p, 5 * p, 2 * p, 1 * p);
      }

      // Yellow feet
      ctx.fillStyle = '#ffb300';
      ctx.fillRect(-1 * p, 5 * p, 2 * p, 2 * p);
    }

    function drawGoosePixel(frame, isDead) {
      const p = 3;

      // Long Graceful Goose Neck & Head (Crisp White)
      ctx.fillStyle = '#e0e0e0';
      ctx.fillRect(3 * p, -6 * p, 3 * p, 7 * p);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(4 * p, -5 * p, 2 * p, 5 * p);

      // Beak (Vibrant Orange)
      ctx.fillStyle = '#ff6d00';
      ctx.fillRect(6 * p, -5 * p, 4 * p, 2 * p);

      // Eye
      ctx.fillStyle = '#000000';
      ctx.fillRect(4 * p, -5 * p, 1 * p, 1 * p);

      // Sleek Goose Body (Light Gray & White)
      ctx.fillStyle = '#cfd8dc';
      ctx.fillRect(-4 * p, 0 * p, 8 * p, 5 * p);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(-3 * p, 1 * p, 6 * p, 3 * p);

      // Tail
      ctx.fillStyle = '#90a4ae';
      ctx.fillRect(-6 * p, 1 * p, 2 * p, 2 * p);

      // Wing animation
      ctx.fillStyle = '#b0bec5';
      if (frame === 0) {
        ctx.fillRect(-2 * p, 1 * p, 5 * p, 2 * p);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(-1 * p, 1 * p, 3 * p, 1 * p);
      } else if (frame === 1) {
        ctx.fillRect(-2 * p, -5 * p, 4 * p, 6 * p);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(-1 * p, -3 * p, 2 * p, 3 * p);
      } else {
        ctx.fillRect(-2 * p, 4 * p, 4 * p, 5 * p);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(-1 * p, 5 * p, 2 * p, 2 * p);
      }

      // Bright Orange Feet
      ctx.fillStyle = '#ff6d00';
      ctx.fillRect(-2 * p, 5 * p, 3 * p, 2 * p);
    }

    function drawPixelHitEffect(isDuck) {
      const p = 3;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(-5 * p, -5 * p, 10 * p, 10 * p);
      ctx.fillStyle = isDuck ? '#00e676' : '#ffea00';
      ctx.fillRect(-3 * p, -3 * p, 6 * p, 6 * p);
      ctx.fillStyle = '#ff1744';
      ctx.fillRect(-1 * p, -1 * p, 2 * p, 2 * p);
    }

    // --- SCENERY & ENVIRONMENT RENDERING ---
    function drawSkyAndSun() {
      // 8-bit solid sky blue
      ctx.fillStyle = '#3cbcfc';
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      // Pixelated Retro Sun
      ctx.fillStyle = '#fff9c4';
      ctx.fillRect(80, 50, 48, 48);
      ctx.fillStyle = '#ffee58';
      ctx.fillRect(86, 56, 36, 36);
    }

    function drawPixelClouds() {
      ctx.fillStyle = '#ffffff';
      clouds.forEach(c => {
        c.x += c.speed;
        if (c.x > WIDTH + 80) c.x = -120;

        const x = Math.round(c.x);
        const y = Math.round(c.y);
        const w = c.width;

        // Blocky NES style cloud steps
        ctx.fillRect(x + 16, y, w - 32, 24);
        ctx.fillRect(x + 8, y + 8, w - 16, 24);
        ctx.fillRect(x, y + 16, w, 20);

        // Subtle cloud shading
        ctx.fillStyle = '#e1f5fe';
        ctx.fillRect(x + 8, y + 32, w - 16, 4);
        ctx.fillStyle = '#ffffff';
      });
    }

    function drawPixelTree(baseX, baseY) {
      // Trunk
      ctx.fillStyle = '#5d4037';
      ctx.fillRect(baseX + 20, baseY - 90, 16, 90);
      ctx.fillStyle = '#3e2723';
      ctx.fillRect(baseX + 28, baseY - 90, 8, 90);

      // Foliage steps
      ctx.fillStyle = '#1b5e20';
      ctx.fillRect(baseX - 18, baseY - 140, 92, 48);
      ctx.fillRect(baseX - 6, baseY - 170, 68, 38);
      ctx.fillRect(baseX + 6, baseY - 192, 44, 28);

      // Highlights
      ctx.fillStyle = '#2e7d32';
      ctx.fillRect(baseX - 10, baseY - 134, 76, 20);
      ctx.fillRect(baseX, baseY - 164, 56, 18);
      ctx.fillRect(baseX + 10, baseY - 188, 36, 12);
    }

    function drawPixelBush(x, y, w) {
      ctx.fillStyle = '#1b5e20';
      ctx.fillRect(x, y - 24, w, 24);
      ctx.fillRect(x + 8, y - 36, w - 16, 16);

      ctx.fillStyle = '#388e3c';
      ctx.fillRect(x + 4, y - 20, w - 8, 12);
      ctx.fillRect(x + 12, y - 32, w - 24, 8);
    }

    function drawGround() {
      // Top turf grass line
      ctx.fillStyle = '#43a047';
      ctx.fillRect(0, GROUND_Y, WIDTH, 16);

      // Dirt field
      ctx.fillStyle = '#8d6e63';
      ctx.fillRect(0, GROUND_Y + 16, WIDTH, HEIGHT - (GROUND_Y + 16));

      // Darker dirt strata
      ctx.fillStyle = '#5d4037';
      ctx.fillRect(0, GROUND_Y + 36, WIDTH, HEIGHT - (GROUND_Y + 36));

      // Grass fringe
      grassBlades.forEach(blade => {
        ctx.fillStyle = blade.color;
        ctx.fillRect(blade.x, GROUND_Y - blade.height + 6, 8, blade.height);
      });

      // Decorative pixel rocks/pebbles
      ctx.fillStyle = '#a1887f';
      ctx.fillRect(70, GROUND_Y + 24, 8, 4);
      ctx.fillRect(230, GROUND_Y + 44, 10, 6);
      ctx.fillRect(490, GROUND_Y + 28, 12, 5);
      ctx.fillRect(680, GROUND_Y + 48, 8, 4);
    }

    // --- HUD AND AMMO UI ---
    function drawHUD() {
      // Top Status Bar
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, WIDTH, 40);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.strokeRect(2, 2, WIDTH - 4, 36);

      ctx.font = '12px "Press Start 2P", monospace';
      ctx.fillStyle = '#ffeb3b';
      ctx.fillText(`SCORE: ${score.toString().padStart(5, '0')}`, 16, 25);

      ctx.fillStyle = '#00e676';
      ctx.fillText(`HIGH: ${highScore.toString().padStart(5, '0')}`, 310, 25);

      if (streak > 1) {
        ctx.fillStyle = '#ff5252';
        ctx.fillText(`STREAK x${streak}!`, 570, 25);
      } else {
        ctx.fillStyle = '#ffffff';
        ctx.fillText(`DUCK:10 GOOSE:5`, 530, 25);
      }

      // Bottom Ammo Belt HUD
      ctx.fillStyle = '#111111';
      ctx.fillRect(0, HEIGHT - 36, WIDTH, 36);
      ctx.strokeStyle = '#333333';
      ctx.lineWidth = 2;
      ctx.strokeRect(2, HEIGHT - 34, WIDTH - 4, 32);

      ctx.fillStyle = '#ffffff';
      ctx.font = '10px "Press Start 2P", monospace';
      ctx.fillText(`SHOTS:`, 16, HEIGHT - 16);

      // Render 20 Pixel Shotgun Shells
      const shellStartX = 96;
      for (let i = 0; i < MAX_SHOTS; i++) {
        const shellX = shellStartX + i * 16;
        const shellY = HEIGHT - 26;
        const isLoaded = i < shotsLeft;

        if (isLoaded) {
          // Brass Base
          ctx.fillStyle = '#ffd54f';
          ctx.fillRect(shellX, shellY + 10, 8, 5);
          // Red Plastic Casing
          ctx.fillStyle = '#d32f2f';
          ctx.fillRect(shellX, shellY, 8, 10);
          // Highlight
          ctx.fillStyle = '#ff8a80';
          ctx.fillRect(shellX + 1, shellY + 1, 2, 8);
        } else {
          // Spent Gray Hull
          ctx.fillStyle = '#37474f';
          ctx.fillRect(shellX, shellY + 10, 8, 5);
          ctx.fillStyle = '#263238';
          ctx.fillRect(shellX, shellY, 8, 10);
        }
      }

      // Quick hit counters
      ctx.fillStyle = '#81c784';
      ctx.fillText(`🦆x${ducksHit}`, WIDTH - 170, HEIGHT - 16);
      ctx.fillStyle = '#e0e0e0';
      ctx.fillText(`🪿x${geeseHit}`, WIDTH - 80, HEIGHT - 16);
    }

    // --- OVERLAYS & GAME STATES ---
    function drawTitleScreen() {
      // Dark translucent backdrop
      ctx.fillStyle = 'rgba(0, 0, 0, 0.78)';
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      // Title Card Border
      ctx.strokeStyle = '#ffd54f';
      ctx.lineWidth = 4;
      ctx.strokeRect(50, 40, WIDTH - 100, HEIGHT - 80);

      ctx.textAlign = 'center';
      ctx.fillStyle = '#ff5252';
      ctx.font = '28px "Press Start 2P", monospace';
      ctx.fillText('DUCK SHOOT', WIDTH / 2, 110);

      ctx.fillStyle = '#40c4ff';
      ctx.font = '14px "Press Start 2P", monospace';
      ctx.fillText('8-BIT ARCADE HUNTING', WIDTH / 2, 145);

      // Rules Box
      ctx.fillStyle = '#263238';
      ctx.fillRect(90, 175, WIDTH - 180, 140);
      ctx.strokeStyle = '#546e7a';
      ctx.lineWidth = 2;
      ctx.strokeRect(90, 175, WIDTH - 180, 140);

      ctx.fillStyle = '#ffffff';
      ctx.font = '11px "Press Start 2P", monospace';
      ctx.fillText('MISSION BRIEFING:', WIDTH / 2, 205);

      ctx.fillStyle = '#69f0ae';
      ctx.fillText('DUCK  = 10 POINTS (AGILE & FAST)', WIDTH / 2, 235);
      ctx.fillStyle = '#fff59d';
      ctx.fillText('GOOSE =  5 POINTS (SWIFT & ERRATIC)', WIDTH / 2, 260);

      ctx.fillStyle = '#ff80ab';
      ctx.fillText('AMMO  = 20 SHOTGUN SHELLS TOTAL', WIDTH / 2, 285);

      // Flashing Start Prompt
      if (Math.floor(Date.now() / 450) % 2 === 0) {
        ctx.fillStyle = '#ffeb3b';
        ctx.font = '14px "Press Start 2P", monospace';
        ctx.fillText('★ CLICK SCREEN TO INSERT COIN ★', WIDTH / 2, 365);
      }

      ctx.fillStyle = '#b0bec5';
      ctx.font = '9px "Press Start 2P", monospace';
      ctx.fillText('AUDIO PLAYS AUTOMATICALLY UPON CLICK', WIDTH / 2, 405);
      ctx.textAlign = 'left';
    }

    function drawGameOverScreen() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      ctx.strokeStyle = '#f44336';
      ctx.lineWidth = 4;
      ctx.strokeRect(60, 40, WIDTH - 120, HEIGHT - 80);

      ctx.textAlign = 'center';
      ctx.fillStyle = '#ff1744';
      ctx.font = '26px "Press Start 2P", monospace';
      ctx.fillText('ROUND OVER!', WIDTH / 2, 105);

      ctx.fillStyle = '#ffffff';
      ctx.font = '13px "Press Start 2P", monospace';
      ctx.fillText('OUT OF SHELLS', WIDTH / 2, 135);

      // Scorecard frame
      ctx.fillStyle = '#1e232a';
      ctx.fillRect(110, 160, WIDTH - 220, 165);
      ctx.strokeStyle = '#455a64';
      ctx.lineWidth = 2;
      ctx.strokeRect(110, 160, WIDTH - 220, 165);

      const totalHits = ducksHit + geeseHit;
      const accuracy = totalShotsFired > 0 ? Math.round((totalHits / totalShotsFired) * 100) : 0;

      ctx.fillStyle = '#ffeb3b';
      ctx.font = '14px "Press Start 2P", monospace';
      ctx.fillText(`FINAL SCORE: ${score}`, WIDTH / 2, 195);

      ctx.fillStyle = '#ffffff';
      ctx.font = '10px "Press Start 2P", monospace';
      ctx.fillText(`DUCKS BAGGED  : ${ducksHit} (x10)`, WIDTH / 2, 225);
      ctx.fillText(`GEESE BAGGED  : ${geeseHit} (x5)`, WIDTH / 2, 248);
      ctx.fillText(`SHOT ACCURACY : ${accuracy}%`, WIDTH / 2, 271);

      if (score >= highScore && score > 0) {
        ctx.fillStyle = '#00e676';
        ctx.fillText('★ NEW HIGH SCORE RECORD! ★', WIDTH / 2, 302);
      } else {
        ctx.fillStyle = '#90a4ae';
        ctx.fillText(`CURRENT RECORD: ${highScore}`, WIDTH / 2, 302);
      }

      if (Math.floor(Date.now() / 450) % 2 === 0) {
        ctx.fillStyle = '#00e5ff';
        ctx.font = '13px "Press Start 2P", monospace';
        ctx.fillText('CLICK TO PLAY ANOTHER ROUND', WIDTH / 2, 370);
      }
      ctx.textAlign = 'left';
    }

    // --- GAME LOGIC ---
    function spawnBird() {
      if (gameState !== STATE_PLAYING) return;
      if (birds.length < 3 && shotsLeft > 0) {
        birds.push(new Bird());
      }
    }

    function addScorePopup(x, y, text, color) {
      popups.push({
        x: x,
        y: y,
        text: text,
        color: color,
        life: 42
      });
    }

    function triggerShot(mouseX, mouseY) {
      sound.init();

      if (gameState === STATE_TITLE) {
        startGame();
        return;
      }

      if (gameState === STATE_GAMEOVER) {
        startGame();
        return;
      }

      if (shotsLeft <= 0) return;

      // Deduct ammo & trigger recoil
      shotsLeft--;
      totalShotsFired++;
      screenFlash = 4;
      cameraShake = 5;
      sound.playGunshot();

      let targetHit = false;

      // Hit-check reverse order (top bird first)
      for (let i = birds.length - 1; i >= 0; i--) {
        const b = birds[i];
        if (b.state !== 'FLYING') continue;

        const dist = Math.hypot(mouseX - b.x, mouseY - b.y);
        if (dist <= 38) {
          targetHit = true;
          streak++;
          const comboBonus = streak > 2 ? streak * 2 : 0;
          const hitScore = b.points + comboBonus;

          score += hitScore;
          if (b.isDuck) ducksHit++;
          else geeseHit++;

          sound.playHit(b.isDuck);

          b.state = 'STRUCK';
          b.stateTimer = 10;

          const bonusLabel = comboBonus > 0 ? `+${hitScore} (x${streak})` : `+${hitScore}`;
          addScorePopup(b.x, b.y - 10, bonusLabel, b.isDuck ? '#69f0ae' : '#ffee58');
          break;
        }
      }

      if (!targetHit) {
        streak = 0;
        sound.playMiss();
        addScorePopup(mouseX, mouseY, 'MISS', '#ff5252');
      }

      if (shotsLeft <= 0) {
        // Wait briefly for birds to drop, then conclude round
        setTimeout(() => {
          endGame();
        }, 850);
      }
    }

    function startGame() {
      gameState = STATE_PLAYING;
      score = 0;
      shotsLeft = MAX_SHOTS;
      streak = 0;
      ducksHit = 0;
      geeseHit = 0;
      totalShotsFired = 0;
      birds = [];
      popups = [];
      screenFlash = 0;
      cameraShake = 0;
      lastSpawnTime = Date.now();
      birds.push(new Bird());
    }

    function endGame() {
      if (gameState === STATE_GAMEOVER) return;
      gameState = STATE_GAMEOVER;

      if (score > highScore) {
        highScore = score;
        localStorage.setItem('duckhunt_highscore', highScore.toString());
      }
      sound.playGameOver();
    }

    // --- EVENT LISTENERS ---
    canvas.addEventListener('mousedown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const x = (e.clientX - rect.left) * scaleX;
      const y = (e.clientY - rect.top) * scaleY;
      triggerShot(x, y);
    });

    toggleAudioBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      sound.init();
      sound.enabled = !sound.enabled;
      toggleAudioBtn.textContent = `AUDIO: ${sound.enabled ? 'ON' : 'OFF'}`;
      toggleAudioBtn.style.background = sound.enabled ? '#37474f' : '#b71c1c';
    });

    toggleScanBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (scanlines.style.display === 'none') {
        scanlines.style.display = 'block';
        toggleScanBtn.textContent = 'CRT SCANLINES: ON';
      } else {
        scanlines.style.display = 'none';
        toggleScanBtn.textContent = 'CRT SCANLINES: OFF';
      }
    });

    // --- MAIN GAME LOOP ---
    function gameLoop(timestamp) {
      // Periodic spawn
      if (gameState === STATE_PLAYING && Date.now() - lastSpawnTime > 1150) {
        spawnBird();
        lastSpawnTime = Date.now();
      }

      // Shake & Recoil
      ctx.save();
      if (cameraShake > 0) {
        const sx = (Math.random() - 0.5) * cameraShake * 2;
        const sy = (Math.random() - 0.5) * cameraShake * 2;
        ctx.translate(sx, sy);
        cameraShake *= 0.85;
        if (cameraShake < 0.2) cameraShake = 0;
      }

      // Scenery background
      drawSkyAndSun();
      drawPixelClouds();
      drawPixelTree(60, GROUND_Y + 10);
      drawPixelTree(620, GROUND_Y + 10);
      drawPixelBush(220, GROUND_Y + 10, 80);
      drawPixelBush(450, GROUND_Y + 10, 95);

      // Birds
      for (let i = birds.length - 1; i >= 0; i--) {
        const b = birds[i];
        b.update();
        b.draw();

        // Remove off-screen or grounded birds
        if (b.state === 'FALLING' && b.y > GROUND_Y + 30) {
          birds.splice(i, 1);
        } else if (b.state === 'FLYING' && (b.x < -80 || b.x > WIDTH + 80)) {
          birds.splice(i, 1);
        }
      }

      // Foreground terrain (birds fly behind bushes/trees)
      drawGround();

      // Hit & Miss text Popups
      for (let i = popups.length - 1; i >= 0; i--) {
        const p = popups[i];
        ctx.font = '11px "Press Start 2P", monospace';
        ctx.fillStyle = p.color;
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 3;
        ctx.strokeText(p.text, p.x, p.y);
        ctx.fillText(p.text, p.x, p.y);

        p.y -= 1.1;
        p.life--;
        if (p.life <= 0) popups.splice(i, 1);
      }

      // Screen Recoil Flash
      if (screenFlash > 0) {
        ctx.fillStyle = `rgba(255, 255, 255, ${screenFlash * 0.12})`;
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
        screenFlash--;
      }

      ctx.restore();

      // HUD and Menus
      drawHUD();

      if (gameState === STATE_TITLE) {
        drawTitleScreen();
      } else if (gameState === STATE_GAMEOVER) {
        drawGameOverScreen();
      }

      requestAnimationFrame(gameLoop);
    }

    // Initialize environment and start loop
    initClouds();
    initGrass();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
