<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Retro 8-Bit Duck Shoot Arcade</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d0f17;
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Outer Cabinet Frame with responsive scaling */
    .arcade-cabinet {
      width: 100vw;
      height: 100vh;
      max-width: 960px;
      max-height: 640px;
      display: flex;
      flex-direction: column;
      background: #1e1310;
      border: 4px solid #3d281e;
      box-shadow: 0 0 30px rgba(0,0,0,0.9);
      position: relative;
    }

    @media (min-width: 768px) {
      .arcade-cabinet {
        height: 94vh;
        border-radius: 16px;
        border-width: 6px;
      }
    }

    /* Top Marquee Header */
    .marquee {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 12px;
      background: #c62828;
      border-bottom: 3px solid #ffe082;
      color: #fffde7;
      font-size: 10px;
      letter-spacing: 1px;
      text-shadow: 2px 2px 0 #000;
      flex-shrink: 0;
    }

    .marquee-title {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #ffeb3b;
    }

    .btn-header {
      background: #263238;
      color: #eceff1;
      border: 2px solid #78909c;
      font-family: inherit;
      font-size: 9px;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 2px 0 #000;
      touch-action: manipulation;
    }

    .btn-header:active {
      transform: translateY(1px);
      box-shadow: none;
    }

    /* Canvas Screen Bezel */
    .screen-area {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      cursor: crosshair;
      touch-action: none;
    }

    /* CRT scanline simulation layer */
    .scanlines {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%);
      background-size: 100% 4px;
      z-index: 5;
    }

    .crt-vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.75);
      z-index: 6;
    }

    /* Bottom Quick Legend */
    .mobile-legend {
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: #14171f;
      border-top: 2px solid #2e3846;
      padding: 5px 8px;
      font-size: 7.5px;
      color: #b0bec5;
      flex-shrink: 0;
      overflow-x: auto;
      white-space: nowrap;
    }

    .leg-duck { color: #69f0ae; }
    .leg-goose { color: #ffffff; }
    .leg-deer { color: #ffd54f; }
    .leg-eagle { color: #ff5252; }
  </style>
</head>
<body>

  <div class="arcade-cabinet">
    <div class="marquee">
      <div class="marquee-title">
        <span>★ DUCK SHOOT ★</span>
        <span style="font-size: 8px; color: #ffe082;">8-BIT MOBILE</span>
      </div>
      <div style="display: flex; gap: 6px;">
        <button id="audioToggleBtn" class="btn-header" aria-label="Toggle Sound">SFX: ON</button>
        <button id="scanlineToggleBtn" class="btn-header" aria-label="Toggle CRT Scanlines">CRT: ON</button>
      </div>
    </div>

    <div class="screen-area" id="screenContainer">
      <canvas id="gameCanvas" width="800" height="480"></canvas>
      <div id="scanlineLayer" class="scanlines"></div>
      <div class="crt-vignette"></div>
    </div>

    <div class="mobile-legend">
      <span class="leg-duck">🦆 DUCK: +10</span>
      <span class="leg-goose">🪿 GOOSE: +5</span>
      <span class="leg-deer">🦌 DEER (x2): +50</span>
      <span class="leg-eagle">🦅 EAGLE (x1): -100</span>
    </div>
  </div>

  <script>
    /* ========================================================
       1. SYNTHESIZED WEB AUDIO ENGINE (Zero external assets)
       ======================================================== */
    class RetroAudio {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playShot() {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;

        // Noise burst (gunpowder crack)
        const bufferSize = Math.floor(this.ctx.sampleRate * 0.14);
        const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = Math.random() * 2 - 1;
        }

        const noise = this.ctx.createBufferSource();
        noise.buffer = noiseBuffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(2200, now);
        filter.frequency.exponentialRampToValueAtTime(100, now + 0.14);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.7, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.14);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start(now);

        // Low frequency thud
        const osc = this.ctx.createOscillator();
        const oscGain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.12);

        oscGain.gain.setValueAtTime(0.5, now);
        oscGain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);

        osc.connect(oscGain);
        oscGain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.13);
      }

      playDuckHit() {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(450, now);
        osc.frequency.setValueAtTime(620, now + 0.05);
        osc.frequency.setValueAtTime(880, now + 0.1);

        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.22);
      }

      playGooseHit() {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.setValueAtTime(280, now + 0.06);
        osc.frequency.setValueAtTime(360, now + 0.12);

        gain.gain.setValueAtTime(0.22, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.22);
      }

      playDeerHit() {
        if (this.muted || !this.ctx) return;
        const notes = [523.25, 659.25, 783.99, 1046.5]; // C5, E5, G5, C6 fanfare
        notes.forEach((freq, i) => {
          const t = this.ctx.currentTime + i * 0.055;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, t);

          gain.gain.setValueAtTime(0.28, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.16);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.18);
        });
      }

      playEagleHit() {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        // Harsh discordant dual-buzz buzzer
        const o1 = this.ctx.createOscillator();
        const o2 = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        o1.type = 'sawtooth';
        o2.type = 'square';
        o1.frequency.setValueAtTime(120, now);
        o1.frequency.setValueAtTime(80, now + 0.2);
        o2.frequency.setValueAtTime(127, now); // Inharmonic beat
        o2.frequency.setValueAtTime(85, now + 0.2);

        gain.gain.setValueAtTime(0.45, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.45);

        o1.connect(gain);
        o2.connect(gain);
        gain.connect(this.ctx.destination);

        o1.start(now);
        o2.start(now);
        o1.stop(now + 0.48);
        o2.stop(now + 0.48);
      }

      playMiss() {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.linearRampToValueAtTime(60, now + 0.12);

        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.12);
      }

      playGameOver() {
        if (this.muted || !this.ctx) return;
        const notes = [440, 392, 349, 293];
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const t = this.ctx.currentTime + idx * 0.14;
          osc.type = 'square';
          osc.frequency.setValueAtTime(freq, t);

          gain.gain.setValueAtTime(0.24, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.14);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.15);
        });
      }
    }

    const sound = new RetroAudio();

    /* ========================================================
       2. CANVAS, SIZING, AND INPUT HANDLERS
       ======================================================== */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const screenContainer = document.getElementById('screenContainer');
    const scanlineLayer = document.getElementById('scanlineLayer');
    const audioToggleBtn = document.getElementById('audioToggleBtn');
    const scanlineToggleBtn = document.getElementById('scanlineToggleBtn');

    // Internal virtual resolution
    const V_WIDTH = 800;
    const V_HEIGHT = 480;
    const GROUND_Y = V_HEIGHT - 80;

    const STATE_TITLE = 0;
    const STATE_PLAYING = 1;
    const STATE_GAMEOVER = 2;

    let gameState = STATE_TITLE;
    let score = 0;
    let shotsLeft = 20;
    const MAX_SHOTS = 20;
    let streak = 0;

    let ducksHit = 0;
    let geeseHit = 0;
    let deersHit = 0;
    let eaglesHit = 0;
    let totalShotsFired = 0;
    let highScore = parseInt(localStorage.getItem('duckshoot_mobile_hi') || '0', 10);

    let birds = [];
    let groundAnimals = [];
    let popups = [];
    let clouds = [];
    let grassBlades = [];
    let screenFlash = 0;
    let cameraShake = 0;
    let lastSpawnTime = 0;

    // Strict quota constraints
    let eagleSpawned = 0;         // Max 1
    let eagleShotThreshold = 0;   // Appears when shotsLeft <= threshold
    let deerSpawned = 0;          // Max 2
    let deerShotThresholds = [];  // Spaced across 20 shots

    // Mobile resolution scaling (Retina / crisp pixels)
    function resizeCanvas() {
      const rect = screenContainer.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2); // Cap at 2 for performance

      canvas.width = V_WIDTH * dpr;
      canvas.height = V_HEIGHT * dpr;

      ctx.resetTransform();
      ctx.scale(dpr, dpr);
    }

    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 150));
    resizeCanvas();

    /* Precise Touch / Pointer Mapping */
    function handleScreenPointer(e) {
      e.preventDefault();
      sound.init(); // Auto unlock audio context on mobile

      const rect = canvas.getBoundingClientRect();
      const scaleX = V_WIDTH / rect.width;
      const scaleY = V_HEIGHT / rect.height;

      const clientX = e.clientX ?? (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
      const clientY = e.clientY ?? (e.touches && e.touches[0] ? e.touches[0].clientY : 0);

      const x = (clientX - rect.left) * scaleX;
      const y = (clientY - rect.top) * scaleY;

      fireShot(x, y);
    }

    // Use pointerdown with touch-action:none for zero-delay response
    canvas.addEventListener('pointerdown', handleScreenPointer, { passive: false });

    // Audio & CRT Toggles
    audioToggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      sound.init();
      sound.muted = !sound.muted;
      audioToggleBtn.textContent = `SFX: ${sound.muted ? 'OFF' : 'ON'}`;
      audioToggleBtn.style.background = sound.muted ? '#b71c1c' : '#263238';
    });

    scanlineToggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (scanlineLayer.style.display === 'none') {
        scanlineLayer.style.display = 'block';
        scanlineToggleBtn.textContent = 'CRT: ON';
      } else {
        scanlineLayer.style.display = 'none';
        scanlineToggleBtn.textContent = 'CRT: OFF';
      }
    });

    /* ========================================================
       3. SPRITES & ENTITIES
       ======================================================== */
    function initClouds() {
      clouds = [
        { x: 30, y: 30, width: 80, speed: 0.25 },
        { x: 320, y: 55, width: 110, speed: 0.18 },
        { x: 620, y: 25, width: 90, speed: 0.3 }
      ];
    }

    function initGrass() {
      grassBlades = [];
      for (let x = 0; x < V_WIDTH; x += 16) {
        grassBlades.push({
          x: x,
          h: 12 + Math.floor(Math.random() * 16),
          color: Math.random() > 0.4 ? '#43a047' : '#2e7d32'
        });
      }
    }

    class Bird {
      constructor(typeOverride = null) {
        this.type = typeOverride || (Math.random() < 0.55 ? 'DUCK' : 'GOOSE');
        this.isEagle = this.type === 'EAGLE';
        this.isDuck = this.type === 'DUCK';
        this.isGoose = this.type === 'GOOSE';

        if (this.isEagle) {
          this.points = -100;
          this.hitRadius = 56;
          this.animSpeed = 0.1;
        } else if (this.isDuck) {
          this.points = 10;
          this.hitRadius = 38;
          this.animSpeed = 0.2;
        } else {
          this.points = 5;
          this.hitRadius = 36;
          this.animSpeed = 0.22;
        }

        this.fromLeft = Math.random() < 0.5;
        this.x = this.fromLeft ? -80 : V_WIDTH + 80;

        if (this.isEagle) {
          this.y = 55 + Math.random() * 80; // High in the sky
          const spd = 2.4 + Math.random() * 0.6;
          this.vx = (this.fromLeft ? 1 : -1) * spd;
          this.vy = 0;
        } else {
          this.y = 75 + Math.random() * (GROUND_Y - 160);
          const spd = this.isDuck ? (2.8 + Math.random() * 1.5) : (3.6 + Math.random() * 1.6);
          this.vx = (this.fromLeft ? 1 : -1) * spd;
          this.vy = (Math.random() - 0.5) * 1.8;
        }

        this.frame = 0;
        this.flightTimer = Math.random() * 50;
        this.zigzagPhase = Math.random() * Math.PI * 2;
        this.state = 'FLYING'; // FLYING | STRUCK | FALLING
        this.stateTimer = 0;
      }

      update() {
        if (this.state === 'FLYING') {
          this.x += this.vx;
          this.flightTimer += 0.05;

          if (this.isEagle) {
            this.y += Math.sin(this.flightTimer * 0.8) * 0.7;
          } else {
            this.y += Math.sin(this.flightTimer + this.zigzagPhase) * 1.6 + this.vy;
            if (this.y < 45) { this.y = 45; this.vy = Math.abs(this.vy); }
            if (this.y > GROUND_Y - 45) { this.y = GROUND_Y - 45; this.vy = -Math.abs(this.vy); }
          }
          this.frame += this.animSpeed;
        } else if (this.state === 'STRUCK') {
          this.stateTimer--;
          if (this.stateTimer <= 0) this.state = 'FALLING';
        } else if (this.state === 'FALLING') {
          this.y += 7;
          this.x += this.vx * 0.2;
          this.frame += 0.3;
        }
      }

      draw() {
        ctx.save();
        ctx.translate(Math.round(this.x), Math.round(this.y));

        const facingRight = this.vx > 0;
        if (!facingRight) ctx.scale(-1, 1);

        const flapFrame = Math.floor(this.frame) % 3;

        if (this.state === 'STRUCK') {
          drawBurst(this.isEagle ? '#ff1744' : (this.isDuck ? '#00e676' : '#ffffff'));
        } else if (this.state === 'FALLING') {
          ctx.rotate(facingRight ? Math.PI / 2 : -Math.PI / 2);
          if (this.isEagle) drawEagleSprite(0);
          else if (this.isDuck) drawDuckSprite(0);
          else drawGooseSprite(0);
        } else {
          if (this.isEagle) {
            drawEagleSprite(flapFrame);
            // Flashing warning badge
            if (!facingRight) ctx.scale(-1, 1);
            const flash = Math.floor(Date.now() / 200) % 2 === 0;
            ctx.font = '8px "Press Start 2P", monospace';
            ctx.fillStyle = flash ? '#ff1744' : '#ffeb3b';
            ctx.textAlign = 'center';
            ctx.fillText('⚠ EAGLE -100', 0, -32);
          } else if (this.isDuck) {
            drawDuckSprite(flapFrame);
          } else {
            drawGooseSprite(flapFrame);
          }
        }

        ctx.restore();
      }
    }

    class Deer {
      constructor() {
        this.points = 50;
        this.hitRadius = 42;
        this.fromLeft = Math.random() < 0.5;
        this.x = this.fromLeft ? -70 : V_WIDTH + 70;
        this.y = GROUND_Y - 24;
        const spd = 3.6 + Math.random() * 1.4;
        this.vx = (this.fromLeft ? 1 : -1) * spd;

        this.state = 'RUNNING'; // RUNNING | STRUCK | COLLAPSED
        this.stateTimer = 0;
        this.frame = 0;
        this.leapTimer = 0;
      }

      update() {
        if (this.state === 'RUNNING') {
          this.x += this.vx;
          this.frame += 0.22;
          this.leapTimer += 0.16;
          this.currentY = this.y - Math.abs(Math.sin(this.leapTimer)) * 8;
        } else if (this.state === 'STRUCK') {
          this.stateTimer--;
          if (this.stateTimer <= 0) this.state = 'COLLAPSED';
        }
      }

      draw() {
        ctx.save();
        const renderY = this.state === 'RUNNING' ? this.currentY : this.y;
        ctx.translate(Math.round(this.x), Math.round(renderY));

        const facingRight = this.vx > 0;
        if (!facingRight) ctx.scale(-1, 1);

        const runFrame = Math.floor(this.frame) % 4;

        if (this.state === 'STRUCK') {
          drawBurst('#ffd54f');
        } else if (this.state === 'COLLAPSED') {
          drawDeerSprite(0, true);
        } else {
          drawDeerSprite(runFrame, false);
          if (!facingRight) ctx.scale(-1, 1);
          ctx.font = '8px "Press Start 2P", monospace';
          ctx.fillStyle = '#ffd54f';
          ctx.textAlign = 'center';
          ctx.fillText('DEER +50', 0, -30);
        }

        ctx.restore();
      }
    }

    // 8-bit Pixel Drawing Routines
    function drawDuckSprite(frame) {
      const p = 3;
      // Head
      ctx.fillStyle = '#008800';
      ctx.fillRect(4 * p, -4 * p, 4 * p, 4 * p);
      ctx.fillStyle = '#00bb00';
      ctx.fillRect(5 * p, -3 * p, 2 * p, 2 * p);
      // Neck collar
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(4 * p, 0, 3 * p, 1 * p);
      // Orange beak
      ctx.fillStyle = '#ff8800';
      ctx.fillRect(8 * p, -2 * p, 3 * p, 2 * p);
      // Eye
      ctx.fillStyle = '#000000';
      ctx.fillRect(6 * p, -3 * p, 1 * p, 1 * p);
      // Body
      ctx.fillStyle = '#6b3e11';
      ctx.fillRect(-2 * p, 0, 7 * p, 5 * p);
      ctx.fillStyle = '#8b5118';
      ctx.fillRect(-1 * p, 1 * p, 5 * p, 3 * p);
      // Tail
      ctx.fillStyle = '#422405';
      ctx.fillRect(-4 * p, 1 * p, 2 * p, 2 * p);
      // Animated wing
      ctx.fillStyle = '#1e3c72';
      if (frame === 0) {
        ctx.fillRect(-1 * p, 1 * p, 4 * p, 2 * p);
      } else if (frame === 1) {
        ctx.fillRect(-1 * p, -4 * p, 3 * p, 5 * p);
      } else {
        ctx.fillRect(-1 * p, 4 * p, 3 * p, 4 * p);
      }
      // Feet
      ctx.fillStyle = '#ffb300';
      ctx.fillRect(-1 * p, 5 * p, 2 * p, 2 * p);
    }

    function drawGooseSprite(frame) {
      const p = 3;
      // Neck & Head
      ctx.fillStyle = '#e0e0e0';
      ctx.fillRect(3 * p, -6 * p, 3 * p, 7 * p);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(4 * p, -5 * p, 2 * p, 5 * p);
      // Orange bill
      ctx.fillStyle = '#ff6d00';
      ctx.fillRect(6 * p, -5 * p, 4 * p, 2 * p);
      // Eye
      ctx.fillStyle = '#000000';
      ctx.fillRect(4 * p, -5 * p, 1 * p, 1 * p);
      // Body
      ctx.fillStyle = '#cfd8dc';
      ctx.fillRect(-4 * p, 0, 8 * p, 5 * p);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(-3 * p, 1 * p, 6 * p, 3 * p);
      // Animated wing
      ctx.fillStyle = '#b0bec5';
      if (frame === 0) {
        ctx.fillRect(-2 * p, 1 * p, 5 * p, 2 * p);
      } else if (frame === 1) {
        ctx.fillRect(-2 * p, -5 * p, 4 * p, 6 * p);
      } else {
        ctx.fillRect(-2 * p, 4 * p, 4 * p, 5 * p);
      }
      // Feet
      ctx.fillStyle = '#ff6d00';
      ctx.fillRect(-2 * p, 5 * p, 3 * p, 2 * p);
    }

    function drawEagleSprite(frame) {
      const p = 3.6; // Noticeably bigger scale
      // Body
      ctx.fillStyle = '#3e2723';
      ctx.fillRect(-4 * p, -1 * p, 10 * p, 7 * p);
      ctx.fillStyle = '#5d4037';
      ctx.fillRect(-2 * p, 0, 7 * p, 5 * p);
      // White Bald Head
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(6 * p, -5 * p, 5 * p, 6 * p);
      ctx.fillRect(5 * p, -2 * p, 4 * p, 4 * p);
      // Hooked Golden Beak
      ctx.fillStyle = '#ffb300';
      ctx.fillRect(11 * p, -4 * p, 3 * p, 3 * p);
      ctx.fillRect(12 * p, -1 * p, 2 * p, 2 * p);
      // Eye
      ctx.fillStyle = '#000000';
      ctx.fillRect(8 * p, -4 * p, 1.2 * p, 1.2 * p);
      // White tail feathers
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(-8 * p, 0, 4 * p, 4 * p);
      // Giant Wingspan
      ctx.fillStyle = '#271915';
      if (frame === 0) {
        ctx.fillRect(-3 * p, -2 * p, 8 * p, 4 * p);
      } else if (frame === 1) {
        ctx.fillRect(-2 * p, -10 * p, 6 * p, 9 * p);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, -11 * p, 3 * p, 2 * p);
      } else {
        ctx.fillRect(-2 * p, 5 * p, 6 * p, 8 * p);
      }
      // Talons
      ctx.fillStyle = '#ffa000';
      ctx.fillRect(-1 * p, 6 * p, 3 * p, 2 * p);
      ctx.fillRect(2 * p, 6 * p, 3 * p, 2 * p);
    }

    function drawDeerSprite(frame, isDead) {
      const p = 3.2;
      if (isDead) {
        ctx.fillStyle = '#795548';
        ctx.fillRect(-8 * p, 2 * p, 16 * p, 5 * p);
        return;
      }
      // Torso
      ctx.fillStyle = '#8d6e63';
      ctx.fillRect(-6 * p, -3 * p, 12 * p, 6 * p);
      ctx.fillStyle = '#a1887f';
      ctx.fillRect(-4 * p, -2 * p, 8 * p, 4 * p);
      // Neck & Head
      ctx.fillStyle = '#8d6e63';
      ctx.fillRect(4 * p, -7 * p, 3 * p, 6 * p);
      ctx.fillRect(5 * p, -9 * p, 4 * p, 3 * p);
      // Antlers
      ctx.fillStyle = '#d7ccc8';
      ctx.fillRect(4 * p, -13 * p, 1.5 * p, 5 * p);
      ctx.fillRect(3 * p, -12 * p, 3 * p, 1.2 * p);
      ctx.fillRect(2 * p, -14 * p, 1.5 * p, 3 * p);
      ctx.fillRect(5 * p, -14 * p, 1.5 * p, 3 * p);
      // Animated Galloping Legs
      ctx.fillStyle = '#6d4c41';
      if (frame === 0) {
        ctx.fillRect(-7 * p, 3 * p, 2 * p, 6 * p);
        ctx.fillRect(4 * p, 3 * p, 2 * p, 6 * p);
      } else if (frame === 1) {
        ctx.fillRect(-5 * p, 3 * p, 2 * p, 4 * p);
        ctx.fillRect(2 * p, 3 * p, 2 * p, 4 * p);
      } else if (frame === 2) {
        ctx.fillRect(-4 * p, 3 * p, 2 * p, 7 * p);
        ctx.fillRect(2 * p, 3 * p, 2 * p, 7 * p);
      } else {
        ctx.fillRect(-8 * p, 3 * p, 2 * p, 7 * p);
        ctx.fillRect(5 * p, 2 * p, 2 * p, 7 * p);
      }
    }

    function drawBurst(tint) {
      const p = 3;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(-6 * p, -6 * p, 12 * p, 12 * p);
      ctx.fillStyle = tint;
      ctx.fillRect(-4 * p, -4 * p, 8 * p, 8 * p);
    }

    /* ========================================================
       4. GAMEPLAY MECHANICS & LOGIC
       ======================================================== */
    function checkSpecialSpawns() {
      if (gameState !== STATE_PLAYING) return;

      // Eagle Spawn: Exactly 1 per game, rare mid-game
      if (eagleSpawned === 0 && shotsLeft <= eagleShotThreshold && birds.filter(b => b.isEagle).length === 0) {
        birds.push(new Bird('EAGLE'));
        eagleSpawned = 1;
      }

      // Deer Spawns: Exactly 2 per game
      if (deerShotThresholds.length > 0 && shotsLeft <= deerShotThresholds[0]) {
        deerShotThresholds.shift();
        groundAnimals.push(new Deer());
        deerSpawned++;
      }
    }

    function spawnRegularFlier() {
      if (gameState !== STATE_PLAYING || shotsLeft <= 0) return;
      const flierCount = birds.filter(b => b.state === 'FLYING').length;
      if (flierCount < 3) {
        birds.push(new Bird());
      }
    }

    function addScorePopup(x, y, text, color) {
      popups.push({ x, y, text, color, life: 45 });
    }

    function fireShot(x, y) {
      if (gameState === STATE_TITLE || gameState === STATE_GAMEOVER) {
        startGame();
        return;
      }

      if (shotsLeft <= 0) return;

      shotsLeft--;
      totalShotsFired++;
      screenFlash = 4;
      cameraShake = 5;
      sound.playShot();

      let hit = false;

      // 1. Check Deer (Running along grass)
      for (let i = groundAnimals.length - 1; i >= 0; i--) {
        const d = groundAnimals[i];
        if (d.state !== 'RUNNING') continue;
        const dist = Math.hypot(x - d.x, y - (d.currentY || d.y));
        if (dist <= d.hitRadius) {
          hit = true;
          streak++;
          score += d.points;
          deersHit++;
          sound.playDeerHit();
          cameraShake = 8;
          d.state = 'STRUCK';
          d.stateTimer = 12;
          addScorePopup(d.x, d.y - 20, `+${d.points} DEER!`, '#ffd54f');
          break;
        }
      }

      // 2. Check Birds (Duck, Goose, Eagle)
      if (!hit) {
        for (let i = birds.length - 1; i >= 0; i--) {
          const b = birds[i];
          if (b.state !== 'FLYING') continue;
          const dist = Math.hypot(x - b.x, y - b.y);
          if (dist <= b.hitRadius) {
            hit = true;
            if (b.isEagle) {
              // Penalty
              streak = 0;
              score += b.points; // -100
              eaglesHit++;
              sound.playEagleHit();
              cameraShake = 16;
              screenFlash = 8;
              b.state = 'STRUCK';
              b.stateTimer = 15;
              addScorePopup(b.x, b.y - 10, '-100 EAGLE PENALTY!', '#ff1744');
            } else {
              streak++;
              const combo = streak > 2 ? (streak - 1) * 2 : 0;
              const pts = b.points + combo;
              score += pts;
              if (b.isDuck) {
                ducksHit++;
                sound.playDuckHit();
              } else {
                geeseHit++;
                sound.playGooseHit();
              }
              b.state = 'STRUCK';
              b.stateTimer = 10;
              const label = combo > 0 ? `+${pts} (x${streak})` : `+${pts}`;
              addScorePopup(b.x, b.y - 10, label, b.isDuck ? '#69f0ae' : '#ffffff');
            }
            break;
          }
        }
      }

      if (!hit) {
        streak = 0;
        sound.playMiss();
        addScorePopup(x, y, 'MISS', '#ff5252');
      }

      checkSpecialSpawns();

      if (shotsLeft <= 0) {
        setTimeout(endGame, 900);
      }
    }

    function startGame() {
      gameState = STATE_PLAYING;
      score = 0;
      shotsLeft = MAX_SHOTS;
      streak = 0;
      ducksHit = 0;
      geeseHit = 0;
      deersHit = 0;
      eaglesHit = 0;
      totalShotsFired = 0;

      birds = [];
      groundAnimals = [];
      popups = [];
      screenFlash = 0;
      cameraShake = 0;
      lastSpawnTime = Date.now();

      // Configure quotas for the match
      eagleSpawned = 0;
      eagleShotThreshold = Math.floor(Math.random() * 6) + 8; // Between 8 and 13 shots left

      deerSpawned = 0;
      deerShotThresholds = [
        Math.floor(Math.random() * 4) + 15, // deer 1 early
        Math.floor(Math.random() * 5) + 4   // deer 2 late
      ];

      birds.push(new Bird('DUCK'));
    }

    function endGame() {
      if (gameState === STATE_GAMEOVER) return;
      gameState = STATE_GAMEOVER;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('duckshoot_mobile_hi', highScore.toString());
      }
      sound.playGameOver();
    }

    /* ========================================================
       5. RENDERING PIPELINE
       ======================================================== */
    function renderSky() {
      ctx.fillStyle = '#3cbcfc';
      ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

      // Mountains
      ctx.fillStyle = '#607d8b';
      ctx.beginPath();
      ctx.moveTo(0, GROUND_Y);
      ctx.lineTo(130, GROUND_Y - 90);
      ctx.lineTo(260, GROUND_Y);
      ctx.lineTo(410, GROUND_Y - 120);
      ctx.lineTo(560, GROUND_Y);
      ctx.lineTo(700, GROUND_Y - 80);
      ctx.lineTo(V_WIDTH, GROUND_Y);
      ctx.closePath();
      ctx.fill();

      // Mountain snow
      ctx.fillStyle = '#eceff1';
      ctx.beginPath();
      ctx.moveTo(380, GROUND_Y - 95);
      ctx.lineTo(410, GROUND_Y - 120);
      ctx.lineTo(440, GROUND_Y - 95);
      ctx.closePath();
      ctx.fill();

      // Sun
      ctx.fillStyle = '#fff9c4';
      ctx.fillRect(72, 44, 46, 46);
      ctx.fillStyle = '#ffee58';
      ctx.fillRect(78, 50, 34, 34);
    }

    function renderClouds() {
      ctx.fillStyle = '#ffffff';
      clouds.forEach(c => {
        c.x += c.speed;
        if (c.x > V_WIDTH + 80) c.x = -120;
        const x = Math.round(c.x);
        const y = Math.round(c.y);
        ctx.fillRect(x + 16, y, c.width - 32, 20);
        ctx.fillRect(x + 8, y + 8, c.width - 16, 20);
        ctx.fillRect(x, y + 14, c.width, 16);
      });
    }

    function renderTree(baseX, baseY) {
      ctx.fillStyle = '#5d4037';
      ctx.fillRect(baseX + 18, baseY - 84, 16, 84);
      ctx.fillStyle = '#1b5e20';
      ctx.fillRect(baseX - 16, baseY - 130, 84, 48);
      ctx.fillRect(baseX - 6, baseY - 158, 64, 36);
      ctx.fillRect(baseX + 6, baseY - 178, 40, 24);
      ctx.fillStyle = '#2e7d32';
      ctx.fillRect(baseX - 8, baseY - 124, 68, 18);
    }

    function renderBush(x, y, w) {
      ctx.fillStyle = '#1b5e20';
      ctx.fillRect(x, y - 22, w, 22);
      ctx.fillRect(x + 8, y - 32, w - 16, 14);
      ctx.fillStyle = '#388e3c';
      ctx.fillRect(x + 4, y - 18, w - 8, 10);
    }

    function renderGround() {
      ctx.fillStyle = '#43a047';
      ctx.fillRect(0, GROUND_Y, V_WIDTH, 16);
      ctx.fillStyle = '#8d6e63';
      ctx.fillRect(0, GROUND_Y + 16, V_WIDTH, V_HEIGHT - (GROUND_Y + 16));
      ctx.fillStyle = '#5d4037';
      ctx.fillRect(0, GROUND_Y + 36, V_WIDTH, V_HEIGHT - (GROUND_Y + 36));

      grassBlades.forEach(g => {
        ctx.fillStyle = g.color;
        ctx.fillRect(g.x, GROUND_Y - g.h + 4, 8, g.h);
      });
    }

    function renderHUD() {
      // Top Bar
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, V_WIDTH, 38);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.strokeRect(2, 2, V_WIDTH - 4, 34);

      ctx.font = '11px "Press Start 2P", monospace';
      ctx.fillStyle = score >= 0 ? '#ffeb3b' : '#ff5252';
      ctx.fillText(`SCORE: ${score.toString().padStart(5, score < 0 ? ' ' : '0')}`, 16, 24);

      ctx.fillStyle = '#00e676';
      ctx.fillText(`HI: ${highScore.toString().padStart(5, '0')}`, 320, 24);

      if (streak > 1) {
        ctx.fillStyle = '#ff5252';
        ctx.fillText(`STREAK x${streak}!`, 570, 24);
      } else {
        ctx.fillStyle = '#cfd8dc';
        ctx.fillText(`20 SHOTS ROUND`, 550, 24);
      }

      // Bottom Ammo Bar
      ctx.fillStyle = '#101216';
      ctx.fillRect(0, V_HEIGHT - 36, V_WIDTH, 36);
      ctx.strokeStyle = '#2d333b';
      ctx.lineWidth = 2;
      ctx.strokeRect(2, V_HEIGHT - 34, V_WIDTH - 4, 32);

      ctx.fillStyle = '#ffffff';
      ctx.font = '10px "Press Start 2P", monospace';
      ctx.fillText(`AMMO:`, 14, V_HEIGHT - 15);

      // Shotgun Shells (20 total)
      const shellStartX = 78;
      for (let i = 0; i < MAX_SHOTS; i++) {
        const shellX = shellStartX + i * 16;
        const shellY = V_HEIGHT - 25;
        const isLoaded = i < shotsLeft;

        if (isLoaded) {
          ctx.fillStyle = '#ffd54f'; // Brass rim
          ctx.fillRect(shellX, shellY + 9, 8, 4);
          ctx.fillStyle = '#d32f2f'; // Red cartridge
          ctx.fillRect(shellX, shellY, 8, 9);
          ctx.fillStyle = '#ff8a80'; // Pixel highlight
          ctx.fillRect(shellX + 1, shellY + 1, 2, 7);
        } else {
          ctx.fillStyle = '#37474f';
          ctx.fillRect(shellX, shellY + 9, 8, 4);
          ctx.fillStyle = '#212529';
          ctx.fillRect(shellX, shellY, 8, 9);
        }
      }

      // Small Badges on Bottom Right
      ctx.fillStyle = '#69f0ae';
      ctx.fillText(`🦆${ducksHit}`, V_WIDTH - 300, V_HEIGHT - 15);
      ctx.fillStyle = '#ffffff';
      ctx.fillText(`🪿${geeseHit}`, V_WIDTH - 230, V_HEIGHT - 15);
      ctx.fillStyle = '#ffd54f';
      ctx.fillText(`🦌${deersHit}`, V_WIDTH - 160, V_HEIGHT - 15);
      ctx.fillStyle = eaglesHit > 0 ? '#ff1744' : '#78909c';
      ctx.fillText(`🦅${eaglesHit}`, V_WIDTH - 85, V_HEIGHT - 15);
    }

    function renderTitleScreen() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
      ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

      ctx.strokeStyle = '#ffd54f';
      ctx.lineWidth = 3;
      ctx.strokeRect(20, 20, V_WIDTH - 40, V_HEIGHT - 40);

      ctx.textAlign = 'center';
      ctx.fillStyle = '#ff3d00';
      ctx.font = '22px "Press Start 2P", monospace';
      ctx.fillText('DUCK SHOOT ARCADE', V_WIDTH / 2, 65);

      ctx.fillStyle = '#4fc3f7';
      ctx.font = '10px "Press Start 2P", monospace';
      ctx.fillText('MOBILE & TOUCH READY EDITION', V_WIDTH / 2, 92);

      // Card
      ctx.fillStyle = '#1c222b';
      ctx.fillRect(40, 115, V_WIDTH - 80, 220);
      ctx.strokeStyle = '#455a64';
      ctx.lineWidth = 2;
      ctx.strokeRect(40, 115, V_WIDTH - 80, 220);

      ctx.font = '9.5px "Press Start 2P", monospace';
      ctx.fillStyle = '#ffffff';
      ctx.fillText('TARGETS & RULES (20 SHOTS PER ROUND):', V_WIDTH / 2, 142);

      ctx.fillStyle = '#69f0ae';
      ctx.fillText('🦆 DUCK       :  +10 PTS (Common flier)', V_WIDTH / 2, 175);

      ctx.fillStyle = '#ffffff';
      ctx.fillText('🪿 GOOSE      :   +5 PTS (Swift flier)', V_WIDTH / 2, 205);

      ctx.fillStyle = '#ffd54f';
      ctx.fillText('🦌 DEER (x2)  :  +50 PTS (Ground runner bonus!)', V_WIDTH / 2, 238);

      ctx.fillStyle = '#ff1744';
      ctx.fillText('🦅 EAGLE (x1) : -100 PTS (RARE PENALTY TARGET!)', V_WIDTH / 2, 272);

      ctx.fillStyle = '#b0bec5';
      ctx.fillText('Tap directly on targets to fire. Streaks add combo pts!', V_WIDTH / 2, 308);

      // Flashing Start Prompt
      if (Math.floor(Date.now() / 400) % 2 === 0) {
        ctx.fillStyle = '#ffeb3b';
        ctx.font = '14px "Press Start 2P", monospace';
        ctx.fillText('★ TAP SCREEN TO START HUNT ★', V_WIDTH / 2, 385);
      }

      ctx.fillStyle = '#78909c';
      ctx.font = '8px "Press Start 2P", monospace';
      ctx.fillText('TAP ANYWHERE TO UNLOCK RETRO AUDIO', V_WIDTH / 2, 420);
      ctx.textAlign = 'left';
    }

    function renderGameOverScreen() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.88)';
      ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

      ctx.strokeStyle = '#f44336';
      ctx.lineWidth = 3;
      ctx.strokeRect(25, 20, V_WIDTH - 50, V_HEIGHT - 40);

      ctx.textAlign = 'center';
      ctx.fillStyle = '#ff1744';
      ctx.font = '22px "Press Start 2P", monospace';
      ctx.fillText('ROUND OVER!', V_WIDTH / 2, 65);

      ctx.fillStyle = '#ffffff';
      ctx.font = '10px "Press Start 2P", monospace';
      ctx.fillText('ALL 20 ROUNDS FIRED', V_WIDTH / 2, 92);

      // Scorecard
      ctx.fillStyle = '#1e242d';
      ctx.fillRect(50, 115, V_WIDTH - 100, 220);
      ctx.strokeStyle = '#546e7a';
      ctx.lineWidth = 2;
      ctx.strokeRect(50, 115, V_WIDTH - 100, 220);

      const totalHits = ducksHit + geeseHit + deersHit;
      const acc = totalShotsFired > 0 ? Math.round((totalHits / totalShotsFired) * 100) : 0;

      ctx.fillStyle = score >= 0 ? '#ffeb3b' : '#ff5252';
      ctx.font = '15px "Press Start 2P", monospace';
      ctx.fillText(`FINAL SCORE: ${score} PTS`, V_WIDTH / 2, 148);

      ctx.font = '9.5px "Press Start 2P", monospace';
      ctx.fillStyle = '#69f0ae';
      ctx.fillText(`🦆 DUCKS BAGGED : ${ducksHit} (+${ducksHit * 10})`, V_WIDTH / 2, 180);

      ctx.fillStyle = '#ffffff';
      ctx.fillText(`🪿 GEESE BAGGED : ${geeseHit} (+${geeseHit * 5})`, V_WIDTH / 2, 208);

      ctx.fillStyle = '#ffd54f';
      ctx.fillText(`🦌 DEERS BAGGED : ${deersHit}/2 (+${deersHit * 50})`, V_WIDTH / 2, 236);

      ctx.fillStyle = eaglesHit > 0 ? '#ff1744' : '#81c784';
      ctx.fillText(`🦅 EAGLES SHOT  : ${eaglesHit}/1 (${eaglesHit > 0 ? '-100 PENALTY!' : 'CLEAN!'})`, V_WIDTH / 2, 264);

      ctx.fillStyle = '#80deea';
      ctx.fillText(`TARGET ACCURACY : ${acc}%`, V_WIDTH / 2, 292);

      if (score >= highScore && score > 0) {
        ctx.fillStyle = '#69f0ae';
        ctx.fillText('★ NEW ALL-TIME RECORD! ★', V_WIDTH / 2, 320);
      } else {
        ctx.fillStyle = '#90a4ae';
        ctx.fillText(`HIGH RECORD: ${highScore}`, V_WIDTH / 2, 320);
      }

      if (Math.floor(Date.now() / 400) % 2 === 0) {
        ctx.fillStyle = '#00e5ff';
        ctx.font = '13px "Press Start 2P", monospace';
        ctx.fillText('★ TAP ANYWHERE TO PLAY AGAIN ★', V_WIDTH / 2, 385);
      }
      ctx.textAlign = 'left';
    }

    /* ========================================================
       6. MAIN 60FPS GAME LOOP
       ======================================================== */
    function gameLoop() {
      // Spawn timer
      if (gameState === STATE_PLAYING && Date.now() - lastSpawnTime > 1150) {
        spawnRegularFlier();
        checkSpecialSpawns();
        lastSpawnTime = Date.now();
      }

      ctx.save();

      // Camera Shake
      if (cameraShake > 0) {
        const sx = (Math.random() - 0.5) * cameraShake * 2;
        const sy = (Math.random() - 0.5) * cameraShake * 2;
        ctx.translate(sx, sy);
        cameraShake *= 0.84;
        if (cameraShake < 0.2) cameraShake = 0;
      }

      // Backdrop
      renderSky();
      renderClouds();
      renderTree(35, GROUND_Y + 12);
      renderTree(660, GROUND_Y + 12);

      // Flying Birds
      for (let i = birds.length - 1; i >= 0; i--) {
        const b = birds[i];
        b.update();
        b.draw();
        if (b.state === 'FALLING' && b.y > GROUND_Y + 30) {
          birds.splice(i, 1);
        } else if (b.state === 'FLYING' && (b.x < -120 || b.x > V_WIDTH + 120)) {
          birds.splice(i, 1);
        }
      }

      // Ground Turf
      renderGround();

      // Ground Animals (Deer)
      for (let i = groundAnimals.length - 1; i >= 0; i--) {
        const d = groundAnimals[i];
        d.update();
        d.draw();
        if (d.state === 'RUNNING' && (d.x < -100 || d.x > V_WIDTH + 100)) {
          groundAnimals.splice(i, 1);
        } else if (d.state === 'COLLAPSED' && d.stateTimer < -100) {
          groundAnimals.splice(i, 1);
        }
      }

      // Bushes
      renderBush(190, GROUND_Y + 8, 80);
      renderBush(480, GROUND_Y + 8, 90);

      // Popups
      for (let i = popups.length - 1; i >= 0; i--) {
        const p = popups[i];
        ctx.font = '10px "Press Start 2P", monospace';
        ctx.fillStyle = p.color;
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 3;
        ctx.strokeText(p.text, p.x, p.y);
        ctx.fillText(p.text, p.x, p.y);
        p.y -= 1.1;
        p.life--;
        if (p.life <= 0) popups.splice(i, 1);
      }

      // Gun muzzle flash
      if (screenFlash > 0) {
        ctx.fillStyle = `rgba(255, 255, 255, ${screenFlash * 0.12})`;
        ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);
        screenFlash--;
      }

      ctx.restore();

      // HUD & Overlays
      renderHUD();

      if (gameState === STATE_TITLE) {
        renderTitleScreen();
      } else if (gameState === STATE_GAMEOVER) {
        renderGameOverScreen();
      }

      requestAnimationFrame(gameLoop);
    }

    // Initialize and run
    initClouds();
    initGrass();
    requestAnimationFrame(gameLoop);
  </script>
</body>
